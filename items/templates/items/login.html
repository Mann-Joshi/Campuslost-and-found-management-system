<!doctype html>
<html>
<head>
    <title>Find It Login</title>
</head>
<body>
    <h1>Find It</h1>
    <h2>Login</h2>
    {% if form.errors %}
        <p>Your username or password was not correct.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
</body>
</html>
